<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ site.person }} — {{ site.brand }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.person }} unterstützt dich mit energetischer Begleitung, Meditation und täglichen Impulsen auf deinem Weg zu dir selbst.{% endblock %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ base_url }}/assets/css/style.css?v={{ site.build_version }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body data-bg-theme="{{ bg_theme|default('default') }}">

<canvas id="bg-canvas"></canvas>
<div class="bg-scrim"></div>
<div class="grain"></div>

<header>
  <nav class="wrap nav">
    <a href="{{ base_url }}/" class="brand">
      <img class="brand-mark" src="{{ base_url }}/assets/images/logo-mark.png" alt="{{ site.brand }} Logo">
      {{ site.brand }}
    </a>
    <input type="checkbox" id="menuToggle">
    <label for="menuToggle" class="menu-btn"><span></span><span></span><span></span></label>
    <div class="navlinks">
      {% for item in site.nav %}
      <a href="{{ base_url }}{{ item.url }}"{% if item.url == page_url %} class="active"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </div>
  </nav>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer>
  <div class="wrap">
    <div class="foot-brand">
      <img src="{{ base_url }}/assets/images/logo-mark.png" alt="{{ site.brand }} Logo">
      <div>
        <div>{{ site.person }}</div>
        <div style="font-size:13px; color:var(--text-faint); margin-top:4px;">Energetische Begleitung / Impulse / Meditation</div>
        <div style="font-size:13px; color:var(--text-faint); margin-top:4px;">Kontakt: {{ site.contact.email }}</div>
      </div>
    </div>

    <div class="foot-bottom">
      <a href="{{ base_url }}/impressum/">{{ site.footer_copyright }}</a>
    </div>
  </div>
</footer>

<script src="{{ base_url }}/assets/js/site.js?v={{ site.build_version }}"></script>
{% block extra_script %}{% endblock %}
</body>
</html>
