{% extends "base.html" %}
{% block title %}{{ imp.title }} — Tagesimpuls — {{ site.brand }}{% endblock %}
{% block content %}

<section class="tight">
  <div class="wrap impuls-detail">
    <a href="{{ base_url }}/tagliche-impulse/" class="impuls-back mono"><span>←</span> Zurück zu Tägliche Impulse</a>
    <div class="impuls-icon {{ imp.theme }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5">{{ imp.icon|safe }}</svg>
    </div>
    <p class="eyebrow">Tagesimpuls</p>
    <h2 style="margin-top:14px;">{{ imp.title }}</h2>
    <div class="impuls-body">
      {% for p in imp.body %}<p>{{ p }}</p>{% endfor %}
    </div>
    <div class="impuls-nav">
      <a href="{{ base_url }}/tagliche-impulse/{{ prev.slug }}/">← {{ prev.title }}</a>
      <a href="{{ base_url }}/tagliche-impulse/{{ next.slug }}/">{{ next.title }} →</a>
    </div>
  </div>
</section>

{% endblock %}
