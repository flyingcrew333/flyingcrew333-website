title: "Wie läuft eine Sitzung ab?"
subtitle: "Was dich in einem Starseed Healing/Reading/Coaching nach Birgit Fischer erwartet:"
image: "/assets/images/sitzung-1.jpg"
sections:
  - heading: null
    paragraphs:
      - "Die kurze Antwort lautet:"
      - "Es kommt darauf an."
      - "Denn ich habe keinen festen Fahrplan, den wir gemeinsam abarbeiten. Ich verbinde mich mit dir und wir schauen, was sich zeigen möchte."
      - "Du musst also nicht schon vorher wissen, was passieren soll."

  - heading: "Erst einmal ankommen"
    paragraphs:
      - "Eine Sitzung dauert ungefähr eine Stunde und kann persönlich oder über Zoom stattfinden. Du sitzt bequem und darfst erst mal ankommen."
      - "Zu Beginn gibst du mir keine Informationen über dich."
      - "Du musst mir nicht erzählen, was dich beschäftigt, welches Thema du mitbringst oder welche Fragen du hast."
      - "Wir beginnen damit, dass du zur Ruhe kommst. Dabei können zum Beispiel Atemtechniken helfen."
      - "Und dann darfst du einfach fühlen."

  - heading: "Verbindung mit den Energien"
    paragraphs:
      - "Während du immer mehr bei dir ankommst, verbinde ich mich als Brücke zwischen der materiellen und der feinstofflichen Ebene."
      - "Ich nehme wahr, was sich zeigt. Das kann auf ganz unterschiedliche Weise geschehen."
      - "Ich kann Bilder sehen, Informationen erhalten, Energien spüren, etwas innerlich hören oder Körperempfindungen wahrnehmen."
      - "Manchmal ist etwas ganz klar."
      - "Manchmal entwickelt es sich Schritt für Schritt."
      - "Es zeigt sich, was jetzt für dich wichtig ist."
      - "Wir legen vorher nicht fest, was angeschaut werden soll."
      - "Es zeigt sich."
      - "Vielleicht zeigt sich der Körper oder ein bestimmtes Organ."
      - "Vielleicht zeigt sich das Chakrensystem."
      - "Vielleicht führt uns der Weg zu einem Thema aus einem Parallelleben."
      - "Oder es zeigen sich die begleitenden Starseeds."
      - "Vielleicht interessiert dich schon lange die Frage:"
      - "„Von welchen Starseeds werde ich begleitet?“"
      - "Auch dafür darf Raum sein."

  - heading: "Du darfst fühlen, ich erzähle"
    paragraphs:
      - "Während der Session spreche ich kontinuierlich aus, was ich wahrnehme."
      - "Dabei gibt es immer wieder bewusste Pausen."
      - "Denn Wahrnehmen bedeutet nicht zur Zuhören."
      - "Es darf auch gefühlt und integriet werden."
      - "Du musst dabei nichts leisten und nichts richtig machen."
      - "Du darfst einfach da sein und beobachten, was in dir geschieht."

  - heading: "Wenn Energien gewendet werden können"
    paragraphs:
      - "Die Bereiche, die sich zeigen, werden angeschaut und wahrgenommen."
      - "Wenn sich dabei Energien zeigen, die gewendet werden können, geschieht dies in dieser Sitzung."
      - "Dabei muss nichts erzwungen werden."
      - "Das Reading endet auf eine ganz natürliche Weise, die Energien ziehen sich von selbst zurück."

  - heading: "Und dann bist du dran"
    paragraphs:
      - "Nach diesem ersten Teil ist ausreichend Raum für deine eigenen Fragen."
      - "Vielleicht hattest du schon vor Session etwas auf dem Herzen."
      - "Vielleicht sind während dessen neue Fragen entstanden. Oder vielleicht möchtest du einfach deiner Neugier folgen."
      - "Du darfst fragen."
      - "Ich nehme wahr, was sich zu deinen Fragen zeigt."
      - "Und vielleicht gehst du danach mit einem Gefühl nach Hause, das sich gar nicht so leicht in Worte fassen lässt."
      - "Leichter. Berührt. Klarer. Ruhiger."
      - "Mit neuen Gedanken, neuen Impulsen und vielleicht auch mit einem anderen Blick auf dich und das, was dich gerade bewegt."
      - "Manches darf erst einmal nachwirken."
      - "Nicht alles muss sofort verstanden werden."
      - "Was sich während der Session gezeigt hat, darf sich in dir setzen und entfalten - ganz in deinem eigenen Tempo."
      - "Und vielleicht spürst du am Ende vor allem eines:"
      - "Da ist etwas in Bewegung gekommen."
      - "Und es fühlt sich gut an."
