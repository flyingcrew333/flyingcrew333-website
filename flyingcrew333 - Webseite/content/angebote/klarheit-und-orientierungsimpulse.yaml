intro:
- Manchmal gibt es Situationen, in denen der Kopf voll ist und die Richtung unklar wird. In solchen Momenten unterstütze ich dich dabei, wieder mehr Überblick und innere Ordnung zu finden.
- Ich arbeite dabei mit intuitiven Methoden der energetischen Wahrnehmung. Unter anderem nutze ich das Pendel sowie die Methode der Spiritual Response Association (SRT), um Zusammenhänge sichtbar zu machen und dich wieder mehr mit deinem Bauchgefühl und deiner inneren Wahrnehmung in Verbindung zu bringen.
