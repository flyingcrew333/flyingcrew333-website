heading: "❤️ Herzliche Einladung zum Stammtisch"

intro:
  - "Seit 2018 beschäftige ich mich mit Themen, die man vielleicht nicht unbedingt am Stammtisch bespricht. 😉"
  - "Lass uns das ändern!"
  - "Von November bis Februar treffen wir uns einmal im Monat in gemütlicher Runde, um uns auszutauschen, zuzuhören und gemeinsam über das zu sprechen, was uns bewegt und interessiert."

bring_mit_intro: "Bring mit, was dich beschäftigt:"
bring_mit:
  - "✨ deine Visionen"
  - "✨ deine Wahrnehmungen"
  - "✨ deine Erfahrungen"
  - "✨ deine Fragen und Gedanken"

outro:
  - "Es gibt kein festes Thema – wir sprechen über das, was uns interessiert."
  - "Ich freue mich auf dich! ❤️"
  - "Bitte melde dich vorher an, da die Sitzplätze begrenzt sind."

termine: "Jeden 2. Donnerstag im Monat, November bis Februar"
uhrzeit: "19:00 Uhr"
ort: "Surberg, Zwieselweg 9"
