- slug: liebe-ist-unendlich
  title: "Liebe ist unendlich"
  theme: t1
  image: "/assets/images/impulse/liebe-ist-unendlich.jpg"
  icon: '<path d="M12 21C7 17 3 13.5 3 9C3 6 5.2 4 8 4C9.8 4 11.2 5 12 6.3C12.8 5 14.2 4 16 4C18.8 4 21 6 21 9C21 13.5 17 17 12 21Z"/>'
  body:
    - "Liebe ist unendlich. Sie begleitet dich in jedem Moment, auch wenn du sie manchmal nicht wahrnimmst."
    - "Betrachte die Rose. Sie zeigt sich in ihrer vollen Schönheit, verströmt ihren Duft und öffnet sich dem Licht. Ja, sie trägt Stacheln. Doch wer ihre Natur versteht, fürchtet sie nicht. Die Stacheln nehmen ihr nichts von ihrer Schönheit."
    - "Vielleicht ist es bei den Menschen genauso. Jeder trägt seine Erfahrungen, seine Narben und seine Schutzmechanismen in sich."
    - "Doch hinter all dem liegt ein Herz, das lieben und geliebt werden möchte."
    - "Öffne heute dein Herz für die Schönheit des Lebens."
    - "Begegne dir selbst und anderen mit etwas mehr Verständnis, etwas mehr Mitgefühl und etwas mehr Liebe. Lass die Liebe frei fließen und beobachte, wie sich dadurch etwas in dir verändert."
    - "Denn in dem Moment, in dem Liebe deinen Blick auf das Leben berührt, entsteht Weite. Und in dieser Weite offenbart sich eine tiefe, innere Freiheit."
  cta_question: "Möchtest du tiefer gehen?"

- slug: maria
  title: "Maria"
  theme: t3
  image: "/assets/images/impulse/maria.jpg"
  icon: '<path d="M12 3L14 9L20 10L15.5 14L17 20L12 17L7 20L8.5 14L4 10L10 9Z"/>'
  body:
    - "Verbinde dich heute mit der liebevollen, weiblichen Energie Marias. Spüre ihre sanfte Umarmung und lass dich von ihrer mütterlichen Liebe tragen. Sie schenkt dir Geborgenheit, Trost und das Gefühl, genau so angenommen zu sein, wie du bist."
    - "Unzählige Menschen wenden sich mit ihren Gebeten an sie und doch reicht ihre Liebe für alle. Auch für dich ist sie da. Sie begleitet dich, hält dich in ihrem Herzen und versteht dich auf eine Weise, die keine Worte braucht."
    - "Vertraue dem Leben, ganz gleich, wo du gerade stehst. Du bist geliebt, behütet und niemals allein. Öffne dein Herz für Zuversicht und empfange die Liebe, die heute zu dir fließen möchte."
  cta_question: "Möchtest du diese Impulse vertiefen und gemeinsam an neuen Perspektiven arbeiten?"

- slug: zeit
  title: "Zeit"
  theme: t4
  image: "/assets/images/impulse/zeit.jpg"
  icon: '<circle cx="12" cy="12" r="8"/><path d="M12 8V12L15 14"/>'
  body:
    - "Verbinde heute liebevoll das Alte mit dem Neuen. Lass sanft los, was dich nicht mehr trägt, und segne alles, was dich auf deinem bisherigen Weg begleitet hat. Ehre das Vergangene für die Erfahrungen, die Erkenntnisse und die Liebe, die es dir geschenkt hat."
    - "Schenke dir bewusst Zeit zum Innehalten. Blicke mit Dankbarkeit zurück und erkenne, wie weit du bereits gegangen bist. Lass alles noch einmal durch dein Herz fließen und würdige deinen Weg."
    - "Öffne dich anschließend voller Neugier und Vertrauen für das, was vor dir liegt. Lausche den leisen Impulsen deiner Seele und empfange die Visionen, die in dir erwachen möchten."
    - "Und dann feiere das Hier und Jetzt – wie eine heilige Hochzeit zwischen Vergangenheit und Zukunft. Sei ganz präsent in diesem kostbaren Moment und spüre die Freude, das Leben genau hier und jetzt willkommen zu heißen."
  cta_question: "BEREIT FÜR TIEFERE EINBLICKE?"

- slug: meditation-1
  title: "Meditation 1"
  theme: t2
  image: "/assets/images/impulse/meditation-1.jpg"
  icon: '<path d="M12 3V6M12 3C9 3 8 6 8 8C8 12 12 12 12 16C12 18 10.5 19 9 19"/><path d="M6 21H18"/>'
  body:
    - "Tauche ein in das kristalline Licht und lass dich von seiner Reinheit und Klarheit umhüllen. Vor dir öffnet sich ein lichtvolles Portal. Schreite hindurch und betrete den strahlenden Lichttunnel, der dich in höhere Schwingungen trägt. Du bist auf diesem Weg nicht allein – liebevoll wirst du von deinen lichten Helfern und Begleitern unterstützt und behütet."
    - "Öffne nun dein Energiesystem und erlaube deiner Energie, sich sanft auszudehnen. Atme einige Male tief ein und aus. Mit jedem Atemzug lässt du mehr Ruhe in dein System einfließen. Spüre, wie sich dein Körper entspannt, wie Anspannung und Schwere von dir abfallen und sich in Licht auflösen."
    - "Lass alle Begrenzungen, Erwartungen und Gedanken los. Erlaube dir, ganz im gegenwärtigen Moment anzukommen. Vielleicht nimmst du Farben, Bilder, Gefühle oder Botschaften wahr. Vielleicht zeigt sich einfach nur eine tiefe Stille. Alles, was sich zeigt – oder auch nicht zeigt –, ist genau richtig."
    - "Verweile eine Weile in diesem Raum des Lichts und der inneren Weite. Genieße die Verbindung zu deinem Herzen, deiner Seele und den lichtvollen Energien, die dich umgeben. Lass dich von Frieden, Vertrauen und Geborgenheit erfüllen."
    - "Wenn du das Gefühl hast, dass deine Reise vollständig ist, kehre langsam und in deinem eigenen Tempo wieder zurück. Spüre deinen Körper, nimm deinen Atem wahr und komme ganz bewusst im Hier und Jetzt an."
    - "Schenke dir noch einen Moment der Einkehr. Lass das Erlebte nachwirken und reflektiere in Ruhe, welche Eindrücke, Erkenntnisse oder Gefühle du von dieser Reise mitnehmen möchtest. Vielleicht möchtest du sie in deinem Herzen bewahren oder für später notieren. Vertraue darauf, dass alles, was du empfangen hast, zur richtigen Zeit seine Wirkung entfalten wird."
  cta_question: "Möchtest  du diesen Impuls vertiefen?"

- slug: freude
  title: "Freude"
  theme: t1
  image: "/assets/images/impulse/freude.jpg"
  icon: '<circle cx="12" cy="12" r="4.5"/><path d="M12 3V5M12 19V21M4.2 4.2L5.6 5.6M18.4 18.4L19.8 19.8M3 12H5M19 12H21M4.2 19.8L5.6 18.4M18.4 5.6L19.8 4.2"/>'
  body:
    - "Ein erreichter Gipfel, ein wunderschöner Sonnenuntergang, ein köstliches Essen oder ein fesselndes Buch. Der Duft einer Blume, das herzliche Lachen eines lieben Menschen oder das bewusste Spüren deiner eigenen Kraft – die Freude zeigt sich oft in den kleinen und großen Momenten des Lebens."
    - "Was bereitet dir Freude? Was lässt dein Herz leichter werden und schenkt dir neue Energie?"
    - "Nimm dir wieder bewusst Zeit für die Dinge, die dir guttun und die dir ein Lächeln ins Gesicht zaubern."
    - "Vielleicht ist die Freude in letzter Zeit etwas in den Hintergrund gerückt und du hast dich im Hamsterrad des Alltags verloren."
    - "Das passiert uns allen von Zeit zu Zeit. Verurteile dich nicht dafür und verschwende keine Energie mit Vorwürfen. Richte deinen Blick stattdessen liebevoll nach vorne. Besinne dich auf die Tätigkeiten, die dich nähren, inspirieren und erfüllen. Schon kleine Momente der Freude können dein Energiefeld stärken und dir neue Kraft schenken."
    - "Die Freude wartet nicht irgendwo in der Zukunft auf dich – sie möchte heute von dir entdeckt und gelebt werden."
  cta_question: "Möchtest du tiefer gehen und persönliche Impulse für deinen Weg erhalten?"

- slug: meditation-2
  title: "Meditation 2"
  theme: t3
  image: "/assets/images/impulse/meditation-2.jpg"
  icon: '<path d="M12 3V6M12 3C9 3 8 6 8 8C8 12 12 12 12 16C12 18 10.5 19 9 19"/><path d="M6 21H18"/>'
  body:
    - "Tauche heute bewusst in dein Innerstes ein und richte deine Aufmerksamkeit ganz nach innen. In dir wartet etwas darauf, entdeckt zu werden. Nimm dir Zeit für eine Meditation und verbinde dich mit deinem innersten Kern."
    - "Bleibe wach und offen für das, was sich zeigt. Vielleicht erscheint ein Symbol, ein Bild oder eine Botschaft – vielleicht auch nur ein Gefühl oder eine klare innere Ahnung."
    - "Vertraue dem Prozess. Alles, was sich in dir zeigt, hat Bedeutung für deinen Weg. Lausche aufmerksam und folge den Impulsen, die aus deiner Tiefe aufsteigen."
  cta_question: "Möchtest Du diesen Impuls vertiefen?"

- slug: schoepferkraft
  title: "Schöpferkraft"
  theme: t2
  image: "/assets/images/impulse/schoepferkraft.jpg"
  icon: '<path d="M6 20V13C6 9 8.5 5 12 3C15.5 5 18 9 18 13V20"/><path d="M9 20V15C9 13 10.3 12 12 12C13.7 12 15 13 15 15V20"/>'
  body:
    - "Was liegt noch verborgen in dir? Welche Fähigkeiten, Gaben und Kräfte sind in dir angelegt und warten darauf, erweckt zu werden?"
    - "Nimm dir einen Moment und lass dieses innere Bild ganz klar vor dir entstehen. Siehst du die kleine Hütte in dir – einfach, vielleicht begrenzt geglaubt – und doch umgeben von einer lebendigen, strahlenden Energie?"
    - "Jetzt öffne diesen Raum bewusst. Öffne dein Inneres. Erlaube dir, weiter zu werden. Aus der Hütte wird ein Schloss – weit, lichtvoll, kraftvoll und voller Möglichkeiten."
    - "Erkenne klar: In dir liegt eine Schöpferkraft, die größer ist als deine bisherigen Gedanken und Vorstellungen. Du bist fähig, dein inneres Erleben und damit dein Leben bewusst zu gestalten."
    - "Vertraue dieser Kraft. Lass dich führen – von deiner Intuition, deiner inneren Wahrheit und der Energie, die dich von innen heraus wachsen lässt."
  cta_question: "Möchtest du tiefer gehen? Ich unterstütze dich  gerne auf deinem Weg."

- slug: starseeds
  title: "Starseeds"
  theme: t4
  image: "/assets/images/impulse/starseeds.jpg"
  icon: '<path d="M12 2L13.5 8.5L20 7L15.5 12L20 17L13.5 15.5L12 22L10.5 15.5L4 17L8.5 12L4 7L10.5 8.5Z"/>'
  body:
    - "Entweder bist du bereits mit den Energien der Sternensaaten vertraut und hast ihre besondere Schwingung schon in deinem Leben wahrgenommen, oder dieser Tagesimpuls lädt dich heute dazu ein, einen ersten Schritt in diese faszinierende Welt zu machen. Die verschiedenen Sternensaaten tragen einzigartige Qualitäten, Erinnerungen und Potenziale in sich, die uns dabei unterstützen können, unseren eigenen Weg bewusster zu erkennen und zu gehen."
    - "Wenn dich dieses Thema anspricht, findest du in den Kartensets und Büchern von Birgit Fischer eine wunderbare Möglichkeit, tiefer einzutauchen und mehr darüber zu erfahren. Birgit Fischer war meine Lehrerin und Mentorin auf diesem Weg. Durch sie durfte ich die Welt der Sternensaaten auf eine tiefere und bewusstere Weise kennenlernen, wofür ich bis heute sehr dankbar bin. Ihre Kartensets und Bücher sind für mich wertvolle Begleiter und Inspirationsquellen."
    - "Gerade in dieser besonderen Zeit sind die Energien der Sternensaaten sehr präsent und können uns wertvolle Impulse für unsere persönliche Entwicklung schenken."
  cta_question: "Möchtest du mehr über deine eigene Seelenreise und deine Verbindung zu den Sternen erfahren? Gerne begleite ich dich in einer persönlichen Beratung dabei, deine Potenziale zu entfalten."
  cta_label: "Beratung anfragen"

- slug: neue-moeglichkeiten
  title: "Neue Möglichkeiten"
  theme: t1
  image: "/assets/images/impulse/neue-moeglichkeiten.jpg"
  icon: '<circle cx="12" cy="12" r="9"/><path d="M8 14L11 17L16 9"/>'
  body:
    - "Wohin führt dich dein Weg? Gibt es eine Vision in dir, die gesehen und gelebt werden will? Weißt du noch nicht, wie du das Neue beginnen sollst, oder erscheint es dir noch fern und unerreichbar?"
    - "Dann halte einen Moment inne und lass vor deinem inneren Auge eine Brücke entstehen – getragen von Vertrauen, Klarheit und innerer Kraft."
    - "Geh diesen Weg Schritt für Schritt. Auch wenn er noch nicht vollständig sichtbar ist, entsteht er doch mit jedem Schritt, den du wagst."
    - "Überwinde die Hindernisse, die dich bisher zurückgehalten haben, und erlaube dir, deine eigenen Möglichkeiten neu zu entdecken und zu verwirklichen."
  cta_question: "Möchtest du diese Impulse vertiefen und individuell begleitet werden?"

- slug: fluss-des-lebens
  title: "Fluss des Lebens"
  theme: t2
  image: "/assets/images/impulse/fluss-des-lebens.jpg"
  icon: '<path d="M4 15C6 12 8 17 10 14C12 11 14 16 16 13C18 10 20 15 20 15"/><path d="M4 9C6 6 8 11 10 8C12 5 14 10 16 7C18 4 20 9 20 9"/>'
  body:
    - "Die Seerose ruht im Wasser wie eine stille Seele zwischen den Welten. Verwurzelt in der Tiefe, doch immer dem Licht zugewandt, erinnert sie an das ewige Prinzip von Wandel und Wiederkehr."
    - "Wiedergeburt und Reinkarnation zeigen sich im Rhythmus des Lebens selbst: Alles vergeht und wird neu geboren, in jedem Atemzug, in jedem Gedanken, in jedem Erwachen des Bewusstseins."
    - "Jeder Tag ist ein sanftes Sterben des Alten und ein Neubeginn im Licht des Seins. Nichts geht verloren – es wandelt sich nur, wie Wasser, das seine Form verändert, aber niemals sein Wesen."
    - "Das Leben zu bejahen heißt, sich dem göttlichen Fluss hinzugeben, der alles trägt und durchdringt. Vertrauen entsteht, wenn das Herz erkennt: Ich bin Teil eines größeren Kreises, eines ewigen Werdens."
    - "Jeder neue Tag ist eine Schwelle. Eine Einladung, bewusster zu sehen, tiefer zu fühlen und die eigene Seele neu zu erinnern."
    - "Das Herz öffnet sich für die Schönheit, die nicht nur außen liegt, sondern im Inneren erblüht – still, weit und unendlich."
    - "So wird das Leben zu Meditation, zu Präsenz, zu Licht in Bewegung. Und wie die Seerose entfaltet sich das Bewusstsein immer wieder neu – aus der Tiefe ins Licht, aus dem Unsichtbaren ins Sichtbare."
  cta_question: "Möchtest du tiefer in diese Themen eintauchen? Ich begleite dich gerne auf deinem persönlichen Weg."

- slug: einssein
  title: "Einssein"
  theme: t3
  image: "/assets/images/impulse/einssein.jpg"
  icon: '<path d="M12 22C6 22 2 18 2 12C2 6 6 2 12 2C10 6 10 18 12 22Z"/>'
  body:
    - "Das Nichts. Das Licht. Die ewige Quelle allen Seins. Wie nennst du jene göttliche Kraft, die alles erschafft, alles durchströmt und allem Leben seinen Atem schenkt?"
    - "Richte dich heute bewusst auf diese höchste Energie aus. Reinige und kläre deine Chakren, öffne dein Energiefeld und erlaube deinem Bewusstsein, sich weit über die Grenzen des Alltags hinaus auszudehnen."
    - "Spüre, wie du mit dem Ursprung verschmilzt – mit jener unendlichen Quelle, aus der du einst hervorgegangen bist und mit der du in Wahrheit niemals getrennt warst."
    - "Jenseits von Worten, Formen und Vorstellungen offenbart sich reine Präsenz, reine Liebe und reines Bewusstsein. Tauche ein in diese heilige Verbindung und erinnere dich daran, wer du wirklich bist."
    - "Du bist nicht nur ein Teil der Quelle. Du bist Ausdruck der Quelle selbst – getragen, genährt und durchlichtet von ihrer unendlichen Liebe."
  cta_question: null

- slug: dankbarkeit
  title: "Dankbarkeit"
  theme: t4
  image: "/assets/images/impulse/dankbarkeit.jpg"
  icon: '<path d="M12 3C12 3 8 8 8 13C8 16.3 9.8 19 12 19C14.2 19 16 16.3 16 13C16 8 12 3 12 3Z"/>'
  body:
    - "Manchmal verlieren wir im Laufe des Lebens etwas von unserer natürlichen Leichtigkeit. Sorgen, Herausforderungen und Erfahrungen können uns von dem entfernen, was ursprünglich in uns angelegt ist: Vertrauen, Freude und eine tiefe Verbundenheit mit dem Leben."
    - "Doch nichts von dem, was zu unserem wahren Wesen gehört, geht wirklich verloren. Es wartet lediglich darauf, wiederentdeckt zu werden."
    - "Vielleicht lädt dich dieser Tag dazu ein, einen Moment innezuhalten und dich zu fragen:"
    - "Was würde heute anders sein, wenn ich dem Leben mehr vertraue?"
    - "Du musst nichts erzwingen und nichts beschleunigen. Gehe deinen Weg in deinem eigenen Tempo. Vertraue darauf, dass du getragen, geführt und unterstützt bist."
    - "Wenn du deinen Blick auf das richtest, was bereits da ist, entsteht Dankbarkeit. Und mit der Dankbarkeit öffnen sich oft die Türen zu mehr Freude, Leichtigkeit und innerem Frieden."
    - "In der Stille deines Herzens findest du das wieder, wonach du vielleicht schon lange suchst: Liebe, Vertrauen, Unbeschwertheit und die Erinnerung daran, wer du wirklich bist."
    - "Tagesaffirmation:"
    - "Ich vertraue dem Leben. Ich gehe meinen Weg in meinem eigenen Tempo. Mit Dankbarkeit im Herzen öffne ich mich für Freude, Leichtigkeit und die Fülle, die bereits in meinem Leben vorhanden ist."
  cta_question: "BEREIT FÜR DEINE PERSÖNLICHE REISE?"

- slug: anderswelt
  title: "Anderswelt"
  theme: t1
  image: "/assets/images/impulse/anderswelt.jpg"
  icon: '<path d="M20 14.5A8 8 0 1 1 9.5 4A6.5 6.5 0 0 0 20 14.5Z"/>'
  body:
    - "Heute erreicht dich ein Gruß aus der Natur."
    - "Nimm dir einen Moment Zeit, die Schönheit deiner Umgebung bewusst wahrzunehmen. Beobachte die Farben, Formen und Bewegungen der Natur. Jeder Baum, jede Blume und jeder Stein macht die Welt auf seine Weise besonders."
    - "Lass deiner Fantasie freien Lauf und tauche ein in die Welt der Mythen und Sagen. Begegne in Gedanken Zwergen, Feen, Elfen oder Elben und begleite sie auf ihren Wegen durch Wälder, Wiesen und Berge."
    - "Was denkst du darüber? Gehören diese Wesen nur in Geschichten und alte Überlieferungen? Oder erwachen sie in unserer Vorstellungskraft zum Leben, wenn wir die Natur mit offenen Augen betrachten?"
    - "Vielleicht steckt gerade darin ihr Zauber: Sie regen unsere Fantasie an und lassen uns die Natur aus einer anderen Perspektive entdecken."
    - "Wer bereit ist, genauer hinzusehen, entdeckt manchmal Dinge, die anderen verborgen bleiben."
    - "Denn Wunder beginnen oft dort, wo die Fantasie erwacht."
  cta_question: "Möchtest du diesen Impuls in deiner persönlichen Situation vertiefen?"

- slug: krafttiere
  title: "Krafttiere"
  theme: t2
  image: "/assets/images/impulse/krafttiere.jpg"
  icon: '<circle cx="7" cy="8" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="17" cy="8" r="1.6"/><path d="M8 17C8 14 9.8 12 12 12C14.2 12 16 14 16 17"/>'
  body:
    - "Krafttiere sind wundervolle spirituelle Begleiter. Sie stehen uns zur Seite, wenn wir Orientierung brauchen, helfen bei Entscheidungen und erinnern uns daran, welche Stärken wir längst in uns tragen."
    - "Jedes Krafttier bringt seine ganz eigene Energie mit. Vielleicht steckt in dir die Weitsicht eines Adlers, die Ruhe eines Bären oder die unbändige Neugier eines Waschbären, der sich von niemandem sagen lässt, was er tun soll."
    - "Der Salamander steht dabei symbolisch für dein inneres Feuer – also deine Lebensenergie, deine Kraft und deine Fähigkeit zur Wandlung."
    - "Kennst du dein Krafttier? In der Meditation kann es sich zeigen – manchmal leise, manchmal überraschend deutlich. Und wer es lieber spielerisch mag, kann auch mit einem Kartenset auf Entdeckungsreise gehen. Oft wählt dich das Krafttier dabei schneller aus, als du denkst."
    - "Und wer weiß: Vielleicht wartet dein Krafttier schon irgendwo zwischen innerer Ruhe und einem kleinen Augenzwinkern darauf, entdeckt zu werden."
    - "Wenn wir uns erlauben, die Welt mit den Augen eines Entdeckers zu sehen, verwandelt sich Routine in Inspiration. Jede Begegnung, jedes Lächeln und jeder Atemzug trägt das Potenzial in sich, unser Herz zu öffnen und uns mit unserer wahren Essenz zu verbinden."
  cta_question: null
