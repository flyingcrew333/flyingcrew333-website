vision_eyebrow: "Ein Leben in bewusster Energie"
vision_text: "Meine Vision ist es, Menschen dabei zu unterstützen, ihre innere Kraftquelle neu zu entdecken. Durch energetische Impulse und bewusstes Erleben schaffen wir einen Raum für Wachstum, in dem Klarheit und Leichtigkeit den täglichen Weg bestimmen. Es geht darum, nicht nur zu existieren, sondern mit jeder Faser präsent zu sein."
