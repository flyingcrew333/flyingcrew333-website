body:
  - Verbinde dich heute mit der liebevollen, weiblichen Energie Marias. Spüre
    ihre sanfte Umarmung und lass dich von ihrer mütterlichen Liebe tragen. Sie
    schenkt dir Geborgenheit, Trost und das Gefühl, genau so angenommen zu sein,
    wie du bist.
  - Unzählige Menschen wenden sich mit ihren Gebeten an sie und doch reicht ihre
    Liebe für alle. Auch für dich ist sie da. Sie begleitet dich, hält dich in
    ihrem Herzen und versteht dich auf eine Weise, die keine Worte braucht.
  - Vertraue dem Leben, ganz gleich, wo du gerade stehst. Du bist geliebt,
    behütet und niemals allein. Öffne dein Herz für Zuversicht und empfange die
    Liebe, die heute zu dir fließen möchte.
slug: maria
cta_question: Möchtest du diese Impulse vertiefen und gemeinsam an neuen
  Perspektiven arbeiten?
order: 1
