body:
  - Liebe ist unendlich. Sie begleitet dich in jedem Moment, auch wenn du sie
    manchmal nicht wahrnimmst.
  - Betrachte die Rose. Sie zeigt sich in ihrer vollen Schönheit, verströmt
    ihren Duft und öffnet sich dem Licht. Ja, sie trägt Stacheln. Doch wer ihre
    Natur versteht, fürchtet sie nicht. Die Stacheln nehmen ihr nichts von ihrer
    Schönheit.
  - Vielleicht ist es bei den Menschen genauso. Jeder trägt seine Erfahrungen,
    seine Narben und seine Schutzmechanismen in sich.
  - Doch hinter all dem liegt ein Herz, das lieben und geliebt werden möchte.
  - Öffne heute dein Herz für die Schönheit des Lebens.
  - Begegne dir selbst und anderen mit etwas mehr Verständnis, etwas mehr
    Mitgefühl und etwas mehr Liebe. Lass die Liebe frei fließen und beobachte,
    wie sich dadurch etwas in dir verändert.
  - Denn in dem Moment, in dem Liebe deinen Blick auf das Leben berührt,
    entsteht Weite. Und in dieser Weite offenbart sich eine tiefe, innere
    Freiheit.
slug: liebe-ist-unendlich
cta_question: Möchtest du tiefer gehen?
