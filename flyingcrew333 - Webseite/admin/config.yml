backend:
  name: git-gateway
  branch: main

publish_mode: simple
media_folder: "static/images/uploads"
public_folder: "/assets/images/uploads"

locale: "de"

collections:
  # --- Wanderungen: volle Kontrolle, sie darf neue anlegen/löschen ---
  - name: "wanderungen"
    label: "Wanderungen"
    label_singular: "Wanderung"
    folder: "content/wanderungen"
    extension: "yaml"
    create: true
    delete: true
    identifier_field: title
    slug: "{{fields.title}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Foto", name: "image", widget: "image" }
      - { label: "Datum", name: "date", widget: "string", hint: "z. B. 18. September 2026" }
      - { label: "Uhrzeit", name: "time", widget: "string", hint: "z. B. 14:00 Uhr (ca. 2 Stunden)" }
      - { label: "Treffpunkt", name: "meeting_point", widget: "string" }
      - { label: "Energieausgleich / Preis", name: "price", widget: "string", hint: "z. B. 15 €" }
      - label: "Beschreibungstext"
        name: "body"
        widget: "list"
        field: { label: "Absatz", name: "paragraph", widget: "text" }
      - { label: "Reihenfolge (kleiner = weiter oben)", name: "order", widget: "number", default: 99 }

  # --- Mein Weg: eine einzelne Seite mit mehreren Textblöcken ---
  - name: "mein_weg"
    label: "Mein Weg"
    files:
      - name: "mein_weg"
        label: "Mein Weg — Seite"
        file: "content/mein_weg.yaml"
        fields:
          - { label: "Portraitfoto", name: "portrait_image", widget: "image" }
          - label: "Über mich (ein Absatz pro Zeile)"
            name: "about"
            widget: "list"
            field: { label: "Absatz", name: "paragraph", widget: "text" }
          - label: "Werdegang / Ausbildungen"
            name: "timeline"
            widget: "list"
            fields:
              - { label: "Jahr", name: "year", widget: "string" }
              - { label: "Titel der Ausbildung", name: "title", widget: "string" }
              - { label: "Bei wem", name: "people", widget: "string" }
          - label: "Bildergalerie unten"
            name: "gallery"
            widget: "list"
            field: { label: "Foto", name: "photo", widget: "image" }
          - { label: "Vision — Überschrift", name: "vision_eyebrow", widget: "string" }
          - { label: "Vision — Text", name: "vision_text", widget: "text" }

  # --- Angebotsübersicht: nur bearbeiten, keine neuen Angebote anlegen/löschen ---
  - name: "angebote"
    label: "Angebotsübersicht"
    label_singular: "Angebot"
    folder: "content/angebote"
    extension: "yaml"
    create: false
    delete: false
    identifier_field: card_title
    summary: "{{card_title}}"
    fields:
      - { label: "Titel (Kachel)", name: "card_title", widget: "string" }
      - { label: "Foto", name: "image", widget: "image" }
      - { label: "Überschrift (Detailseite)", name: "heading", widget: "string" }
      - label: "Einleitungstext"
        name: "intro"
        widget: "list"
        field: { label: "Absatz", name: "paragraph", widget: "text" }
      - label: "Stichpunkte (optional, klein)"
        name: "tags"
        widget: "list"
        required: false
        field: { label: "Stichpunkt", name: "tag", widget: "string" }
      - { label: "Einleitungssatz zu den Punkten (optional)", name: "pillars_intro", widget: "string", required: false }
      - label: "Punkte / Vorteile (optional)"
        name: "pillars"
        widget: "list"
        required: false
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Beschreibung", name: "desc", widget: "text" }
      - { label: "Kategorie-Label (optional)", name: "category", widget: "string", required: false }
      - { label: "Kleine Überschrift über dem Preis (optional)", name: "section_label", widget: "string", required: false }
      - { label: "Label vor dem Preis (optional)", name: "price_label", widget: "string", required: false }
      - { label: "Preis", name: "price", widget: "string" }
      - { label: "Dauer (optional)", name: "duration", widget: "string", required: false }
      - { label: "Ort/Format (optional)", name: "location", widget: "string", required: false }
      - { label: "Zusatz-Hinweis (optional)", name: "extra", widget: "string", required: false }
      - { label: "Text auf dem Button (optional)", name: "cta", widget: "string", required: false }
      - { name: "order", widget: "hidden" }

  # --- Tägliche Impulse: nur bestehende bearbeiten, keine neuen anlegen ---
  - name: "impulse"
    label: "Tägliche Impulse"
    label_singular: "Impuls"
    folder: "content/impulse"
    extension: "yaml"
    create: false
    delete: false
    identifier_field: title
    summary: "{{title}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { name: "theme", widget: "hidden" }
      - { name: "icon", widget: "hidden" }
      - { label: "Foto", name: "image", widget: "image", required: false }
      - label: "Text"
        name: "body"
        widget: "list"
        field: { label: "Absatz", name: "paragraph", widget: "text" }
      - { label: "Abschlussfrage (optional)", name: "cta_question", widget: "string", required: false }
      - { label: "Text auf dem Button (optional)", name: "cta_label", widget: "string", required: false }
      - { name: "order", widget: "hidden" }
