<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Besucherstatistik — flyingcrew333</title>
<style>
  body{background:#05050a; color:#e8e8ee; font-family:-apple-system,'Space Grotesk',system-ui,sans-serif; margin:0; padding:40px 24px;}
  h1{font-size:22px; margin-bottom:4px;}
  p.sub{color:#9a9aa8; margin-top:0; font-size:14px;}
  .card{background:#15151d; border:1px solid #2a2a35; border-radius:8px; padding:20px; margin:20px 0; max-width:640px;}
  .big{font-size:38px; font-weight:700;}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  td, th{padding:6px 8px; text-align:left; border-bottom:1px solid #2a2a35;}
  #login-msg{color:#9a9aa8;}
  .bar-row{display:flex; align-items:center; gap:10px; margin:6px 0;}
  .bar-path{width:220px; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-track{flex:1; background:#22222c; border-radius:3px; height:10px; overflow:hidden;}
  .bar-fill{height:100%; background:linear-gradient(90deg,#ff6a3d,#d9542a);}
  .bar-count{width:36px; text-align:right; font-size:13px; color:#9a9aa8;}
</style>
</head>
<body>
  <h1>Besucherstatistik</h1>
  <p class="sub">Anonym & ohne Cookies — es werden nur Seitenaufrufe gezählt, keine IP-Adressen oder sonstige persönliche Daten.</p>
  <div id="login-msg">Lädt…</div>
  <div id="content" style="display:none;">
    <div class="card">
      <div>Besuche der letzten 30 Tage</div>
      <div class="big" id="total">–</div>
    </div>
    <div class="card">
      <div style="margin-bottom:10px;">Meistbesuchte Seiten</div>
      <div id="pages"></div>
    </div>
    <div class="card">
      <div style="margin-bottom:10px;">Besuche pro Tag</div>
      <table id="daytable"><thead><tr><th>Tag</th><th>Besuche</th></tr></thead><tbody></tbody></table>
    </div>
  </div>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    function loadStats(user) {
      user.jwt().then(function (token) {
        return fetch("/.netlify/functions/stats", { headers: { Authorization: "Bearer " + token } });
      }).then(function (res) {
        if (!res.ok) throw new Error("Fehler beim Laden (" + res.status + ")");
        return res.json();
      }).then(function (data) {
        document.getElementById("login-msg").style.display = "none";
        document.getElementById("content").style.display = "block";
        document.getElementById("total").textContent = data.grandTotal;

        var pagesEl = document.getElementById("pages");
        var maxCount = data.topPages.length ? data.topPages[0].count : 1;
        data.topPages.forEach(function (p) {
          var pct = Math.round((p.count / maxCount) * 100);
          var row = document.createElement("div");
          row.className = "bar-row";
          var pathDiv = document.createElement("div");
          pathDiv.className = "bar-path";
          pathDiv.textContent = p.path;
          var trackDiv = document.createElement("div");
          trackDiv.className = "bar-track";
          var fillDiv = document.createElement("div");
          fillDiv.className = "bar-fill";
          fillDiv.style.width = pct + "%";
          trackDiv.appendChild(fillDiv);
          var countDiv = document.createElement("div");
          countDiv.className = "bar-count";
          countDiv.textContent = p.count;
          row.appendChild(pathDiv);
          row.appendChild(trackDiv);
          row.appendChild(countDiv);
          pagesEl.appendChild(row);
        });

        var tbody = document.querySelector("#daytable tbody");
        data.days.slice().reverse().forEach(function (d) {
          var tr = document.createElement("tr");
          var tdDay = document.createElement("td");
          tdDay.textContent = d.day;
          var tdTotal = document.createElement("td");
          tdTotal.textContent = d.total;
          tr.appendChild(tdDay);
          tr.appendChild(tdTotal);
          tbody.appendChild(tr);
        });
      }).catch(function (err) {
        document.getElementById("login-msg").textContent = "Fehler: " + err.message;
      });
    }

    if (window.netlifyIdentity) {
      netlifyIdentity.on("init", function (user) {
        if (user) {
          loadStats(user);
        } else {
          document.getElementById("login-msg").textContent = "Bitte einloggen …";
          netlifyIdentity.open();
        }
      });
      netlifyIdentity.on("login", function (user) {
        loadStats(user);
      });
      netlifyIdentity.init();
    }
  </script>
</body>
</html>
